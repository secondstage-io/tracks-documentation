<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="100%" height="auto" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <style>
    .fg { fill: #1d1d20; }
    .muted { fill: #65656b; }
    .card { fill: #ffffff; stroke: #e3e3e6; stroke-width: 1; }
    .muted-card { fill: #f5f5f7; stroke: #d8d8dc; stroke-width: 1; }
    .primary { fill: #dc2626; }
    .primary-card { fill: #fef2f2; stroke: #fecaca; stroke-width: 1; }
    .amber { fill: #b45309; }
    .amber-card { fill: #fffbeb; stroke: #fde68a; stroke-width: 1; }
    .green { fill: #047857; }
    .green-card { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1; }
    .blue { fill: #1d4ed8; }
    .blue-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
    .arrow { stroke: #65656b; stroke-width: 2; fill: none; }
    .arrow-tip { fill: #65656b; }
    .arrow-primary { stroke: #dc2626; stroke-width: 2; fill: none; }
    .arrow-tip-primary { fill: #dc2626; }
    text { font-size: 13px; }
    .label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
    .title { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; }
    .tiny { font-size: 10px; }
  </style>
  <text class="label primary" x="20" y="30">SIX SOURCES</text>
  <line class="arrow" x1="109" y1="26" x2="470" y2="26" stroke-width="1" opacity="0.4"/>
  <rect class="primary-card" x="486" y="20" width="12" height="12" rx="3"/>
  <text class="tiny muted" x="504" y="30">sent to TRACKS</text>
  <rect class="amber-card" x="600" y="20" width="12" height="12" rx="3"/>
  <text class="tiny muted" x="618" y="30">read directly</text>
  <rect class="primary-card" x="20" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="76" y="70" text-anchor="middle" font-weight="600">Website</text>
  <text class="tiny muted" x="76" y="90" text-anchor="middle">GTM tag</text>
  <text class="tiny muted" x="76" y="103" text-anchor="middle">→ Collect</text>
  <line class="arrow" x1="76" y1="126" x2="76" y2="146" stroke-width="1.5"/>
  <rect class="primary-card" x="142" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="198" y="70" text-anchor="middle" font-weight="600">Signup</text>
  <text class="tiny muted" x="198" y="90" text-anchor="middle">Account event</text>
  <text class="tiny muted" x="198" y="103" text-anchor="middle">→ Measure</text>
  <line class="arrow" x1="198" y1="126" x2="198" y2="146" stroke-width="1.5"/>
  <rect class="primary-card" x="263" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="319" y="70" text-anchor="middle" font-weight="600">Game servers</text>
  <text class="tiny muted" x="319" y="90" text-anchor="middle">First gameplay,</text>
  <text class="tiny muted" x="319" y="103" text-anchor="middle">sessions → Measure</text>
  <line class="arrow" x1="319" y1="126" x2="319" y2="146" stroke-width="1.5"/>
  <rect class="primary-card" x="385" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="441" y="70" text-anchor="middle" font-weight="600">Commerce</text>
  <text class="tiny muted" x="441" y="90" text-anchor="middle">Purchases</text>
  <text class="tiny muted" x="441" y="103" text-anchor="middle">→ Measure</text>
  <line class="arrow" x1="441" y1="126" x2="441" y2="146" stroke-width="1.5"/>
  <rect class="amber-card" x="506" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="562" y="70" text-anchor="middle" font-weight="600">Google Analytics 4</text>
  <text class="tiny muted" x="562" y="90" text-anchor="middle">Web sessions</text>
  <text class="tiny muted" x="562" y="103" text-anchor="middle">and events</text>
  <line class="arrow" x1="562" y1="126" x2="562" y2="146" stroke-width="1.5"/>
  <rect class="amber-card" x="628" y="46" width="112" height="76" rx="10"/>
  <text class="small fg" x="684" y="70" text-anchor="middle" font-weight="600">Ad platforms</text>
  <text class="tiny muted" x="684" y="90" text-anchor="middle">Spend, clicks</text>
  <text class="tiny muted" x="684" y="103" text-anchor="middle">and IDs</text>
  <line class="arrow" x1="684" y1="126" x2="684" y2="146" stroke-width="1.5"/>
  <line class="arrow" x1="76" y1="146" x2="684" y2="146" stroke-width="1.5"/>
  <line class="arrow" x1="380" y1="146" x2="380" y2="168"/>
  <polygon class="arrow-tip" points="374,164 386,164 380,174"/>
  <rect class="green-card" x="20" y="178" width="720" height="76" rx="12"/>
  <text class="label green" x="38" y="200">YOUR GOOGLE CLOUD PROJECT</text>
  <text class="title fg" x="38" y="222">TRACKS pipeline</text>
  <text class="tiny muted" x="38" y="240">Joins web visits, accounts, installs and purchases, and credits each to at most one ad click</text>
  <line class="arrow-primary" x1="195" y1="258" x2="195" y2="290"/>
  <polygon class="arrow-tip-primary" points="189,286 201,286 195,296"/>
  <line class="arrow-primary" x1="565" y1="258" x2="565" y2="290"/>
  <polygon class="arrow-tip-primary" points="559,286 571,286 565,296"/>
  <rect class="primary-card" x="20" y="300" width="350" height="74" rx="12"/>
  <text class="label primary" x="38" y="322">REPORTING</text>
  <text class="title fg" x="38" y="344">Daily reporting table → dashboard</text>
  <text class="tiny muted" x="38" y="362">Aggregated: no user IDs, no IPs</text>
  <rect class="blue-card" x="390" y="300" width="350" height="74" rx="12"/>
  <text class="label blue" x="408" y="322">ACTIVATION</text>
  <text class="title fg" x="408" y="344">Conversion postbacks</text>
  <text class="tiny muted" x="408" y="362">Installs and purchases, consented players only</text>

</svg>
